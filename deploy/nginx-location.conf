# Add only inside the existing HTTPS server block for ai.duodianqian.cn.
# Keep the existing Studio locations and TLS settings untouched.
location = /work-os { return 301 /work-os/; }
# Raw video uploads are streamed to disk by Work OS. Keep the regular JSON
# routes at 55m; only this authenticated endpoint accepts a larger body.
location ~ ^/work-os/api/martial/moves/[a-z0-9_]+/motion-file$ {
    rewrite ^/work-os/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18766;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
# Generated candidates use the same bounded streaming path after the local
# connector authenticates; regular JSON reports keep their original limit.
location ~ "^/work-os/api/martial/connector/media/mj_[a-f0-9]{16}/video-file$" {
    rewrite ^/work-os/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18766;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
# AI Studio generated videos use the same bounded transfer after connector auth.
location ~ "^/work-os/api/ai-studio/connector/jobs/aia_[a-f0-9]{16}/video-file$" {
    rewrite ^/work-os/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18766;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
location /work-os/ {
    proxy_pass http://127.0.0.1:18766/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 55m;
    proxy_read_timeout 90s;
}
